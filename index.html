<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Note Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Case Note Generator</h1>

        <div class="form-section">

            <label>Patient Name</label>
            <input type="text" id="patientName" placeholder="Enter patient name">

            <label>DOB</label>
            <input type="text" id="dob" placeholder="MM/DD/YYYY">

            <label>Medication</label>
            <input type="text" id="medication" placeholder="Medication name">

            <label>Reason for Call</label>
            <input type="text" id="reason" placeholder="Reason for call">

            <label>Case Notes</label>
            <textarea id="notes" rows="6" placeholder="Enter case notes"></textarea>

            <div class="button-group">
                <button id="generateBtn">Generate Note</button>
                <button id="clearBtn" class="secondary">Clear</button>
            </div>
        </div>

        <div class="output-section">
            <div class="output-header">
                <h2>Generated Case Note</h2>
                <button id="copyBtn">Copy</button>
            </div>

            <textarea id="output" rows="12" readonly></textarea>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
